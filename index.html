<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de Adviento 2026</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d231d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adviento">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html { background: #0d231d; color-scheme: dark; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { font: 14px/1.5 system-ui, sans-serif; }
img { max-width: 100%; }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito+Sans:wght@400;600;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: guirnalda de luces + título, y debajo un "mosaico" de 24 puertas de distintos tamaños
   (rejilla con áreas fijas: 6 columnas en escritorio, 4 en móvil). Diseño de un solo tema, nocturno. */
:root {
  color-scheme: dark;
  --noche: #0d231d;
  --pino: #163a2d;
  --pino-claro: #21573f;
  --rojo: #b3262d;
  --rojo-osc: #7a161b;
  --oro: #e4b95e;
  --oro-claro: #f6dc9c;
  --crema: #f7eedd;
  --crema-carton: #ecdfc3;
  --crema-tenue: #c9c0ad;
  --plata: #dde6ee;
  --plata-osc: #8fa6ba;
  --azul-tinta: #1f3550;
  --sombra: rgba(0, 0, 0, .45);
  --f-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --f-texto: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--noche);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -5%, var(--pino-claro) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% 110%, #12302a 0%, transparent 70%);
  color: var(--crema);
  font-family: var(--f-texto);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
#nieve { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.pagina {
  position: relative; z-index: 1;
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
  display: flex; flex-direction: column; gap: 26px;
}

/* ---------- Cabecera ---------- */
header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.luces { position: relative; width: min(620px, 100%); height: 46px; }
.luces svg.cable { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bombilla {
  position: absolute; width: 10px; height: 15px; margin-left: -5px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: var(--c); box-shadow: 0 0 10px 2px var(--c);
  animation: parpadeo 2.8s ease-in-out infinite; animation-delay: var(--d);
}
.bombilla::before { content: ""; position: absolute; top: -4px; left: 2px; width: 6px; height: 5px; border-radius: 1px; background: #5b5140; }
@keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .35; box-shadow: 0 0 2px 0 var(--c); } }

.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--oro); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(38px, 8vw, 72px); line-height: 1; text-wrap: balance;
  text-shadow: 0 4px 24px rgba(0,0,0,.35);
}
h1 em { color: var(--oro); font-style: italic; }
.cuenta {
  margin-top: 8px;
  display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 12px;
  padding: 10px 20px; border-radius: 999px;
  background: color-mix(in srgb, var(--pino) 85%, transparent);
  border: 1px solid color-mix(in srgb, var(--oro) 35%, transparent);
}
.cuenta .que { color: var(--crema-tenue); font-size: 14px; }
.cuenta .reloj { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--oro-claro); font-size: 18px; }

/* ---------- Mosaico de puertas ---------- */
.calendario {
  display: grid; gap: 10px; padding: 12px; border-radius: 22px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: clamp(88px, 25vw, 140px);
  grid-template-areas:
    "d14 d14 d7  d2"
    "d14 d14 d7  d19"
    "d11 d9  d9  d3"
    "d16 d24 d24 d3"
    "d16 d24 d24 d5"
    "d20 d1  d12 d12"
    "d8  d1  d17 d4"
    "d13 d13 d17 d21"
    "d10 d18 d23 d23"
    "d10 d6  d15 d22";
  background:
    repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.022) 14px 28px),
    var(--pino);
  box-shadow: 0 24px 60px var(--sombra), inset 0 0 0 2px color-mix(in srgb, var(--oro) 45%, transparent),
              inset 0 0 0 7px var(--pino), inset 0 0 0 8px color-mix(in srgb, var(--oro) 20%, transparent);
}
@media (min-width: 720px) {
  .calendario {
    gap: 14px; padding: 22px;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-auto-rows: clamp(118px, 13vw, 158px);
    grid-template-areas:
      "d14 d14 d7  d2  d19 d19"
      "d14 d14 d7  d11 d3  d22"
      "d16 d9  d9  d5  d3  d20"
      "d16 d1  d24 d24 d12 d12"
      "d8  d1  d24 d24 d17 d4"
      "d21 d13 d13 d18 d17 d10"
      "d6  d6  d23 d23 d15 d10";
  }
}

.casilla {
  position: relative; min-width: 0; min-height: 0;
  perspective: 1100px; container-type: size;
  border: 0; padding: 0; margin: 0; background: none; color: inherit; font: inherit;
  cursor: pointer; border-radius: 12px;
}
.casilla:focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 3px; }

/* hueco interior */
.interior {
  position: absolute; inset: 0; border-radius: 12px;
  background: radial-gradient(circle at 50% 45%, #3a2416 0%, #170e08 78%);
  box-shadow: inset 0 5px 16px rgba(0,0,0,.75);
  display: grid; place-items: center;
}
.interior svg { width: 52cqmin; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); transition: transform .3s; }
.casilla.abierta:hover .interior svg { transform: scale(1.07) rotate(-3deg); }

/* puerta */
.puerta {
  --fondo: var(--rojo); --tinta: var(--crema); --marco: var(--oro); --dibujo: rgba(255,255,255,.1);
  position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
  transform-origin: left center; backface-visibility: hidden;
  transition: transform .95s cubic-bezier(.2,.7,.2,1), filter .3s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqmin;
  color: var(--tinta);
  background-color: var(--fondo);
  box-shadow: 0 8px 18px var(--sombra),
              inset 0 0 0 2px var(--marco),
              inset 0 0 0 6px var(--fondo),
              inset 0 0 0 7px color-mix(in srgb, var(--marco) 40%, transparent);
}
/* brillo de cartón */
.puerta::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 25% 15%, rgba(255,255,255,.16), transparent 50%),
              linear-gradient(160deg, transparent 55%, rgba(0,0,0,.2));
}
/* tirador */
.puerta::before {
  content: ""; position: absolute; right: 9px; top: 50%; width: 5px; height: 16px; margin-top: -8px;
  border-radius: 3px; background: var(--marco); opacity: .75; box-shadow: 0 1px 2px rgba(0,0,0,.4);
}

/* colores */
.c-verde .puerta { --fondo: var(--pino-claro); }
.c-crema .puerta { --fondo: var(--crema-carton); --tinta: var(--rojo-osc); --dibujo: rgba(179,38,45,.12); --marco: #c99a3e; }
.c-granate .puerta { --fondo: var(--rojo-osc); }

/* estampados */
.p-puntos .puerta { background-image: radial-gradient(circle, var(--dibujo) 2px, transparent 2.6px); background-size: 16px 16px; }
.p-rayas .puerta { background-image: repeating-linear-gradient(135deg, var(--dibujo) 0 9px, transparent 9px 18px); }
.p-cuadros .puerta {
  background-image:
    repeating-linear-gradient(0deg, var(--dibujo) 0 6px, transparent 6px 22px),
    repeating-linear-gradient(90deg, var(--dibujo) 0 6px, transparent 6px 22px);
}

/* especiales */
.especial-24 .puerta {
  --fondo: #d9a845; --tinta: var(--rojo-osc); --marco: #fff1c4; --dibujo: rgba(255,255,255,.18);
  background-image:
    radial-gradient(circle at 30% 20%, rgba(255,248,220,.75), transparent 45%),
    linear-gradient(135deg, #f4d488 0%, #c8923a 55%, #e8c172 100%);
}
.especial-14 .puerta {
  --fondo: var(--plata); --tinta: var(--azul-tinta); --marco: #ffffff; --dibujo: rgba(255,255,255,.4);
  background-image:
    radial-gradient(circle at 70% 25%, rgba(255,255,255,.9), transparent 40%),
    linear-gradient(140deg, #f3f7fa 0%, #b9cad8 50%, #e6eef4 100%);
}
.especial-14 .puerta, .especial-24 .puerta { box-shadow: 0 10px 26px var(--sombra), inset 0 0 0 3px var(--marco), inset 0 0 0 8px transparent, inset 0 0 0 9px color-mix(in srgb, var(--tinta) 25%, transparent); }
.especial-14 .brillos, .especial-24 .brillos { display: block; }
.brillos { display: none; position: absolute; inset: 0; pointer-events: none; }
.brillos i {
  position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%;
  box-shadow: 0 0 8px 2px rgba(255,255,255,.9); animation: destello 3s ease-in-out infinite;
}
@keyframes destello { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }

.adorno { width: 22cqmin; height: 22cqmin; opacity: .85; position: relative; z-index: 1; }
.num {
  position: relative; z-index: 1;
  font-family: var(--f-display); font-size: 40cqmin; line-height: .9;
  text-shadow: 0 2px 0 rgba(0,0,0,.18);
}
.especial-14 .num, .especial-24 .num { text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.etiqueta {
  position: relative; z-index: 1; min-height: 14px;
  font-size: clamp(9px, 9cqmin, 12px); font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  display: inline-flex; align-items: center;
}
.candado { width: 13px; height: 13px; opacity: .65; }

/* estados */
.casilla.bloqueada .puerta { filter: saturate(.8) brightness(.9); }
.casilla.bloqueada:hover .puerta { filter: saturate(.9) brightness(.97); }
.casilla.disponible .puerta { animation: brillo 2.4s ease-in-out infinite; }
@keyframes brillo {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(246,220,156,0)); }
  50% { filter: drop-shadow(0 0 14px rgba(246,220,156,.85)); }
}
.casilla.disponible:hover .puerta { transform: rotateY(-16deg); }
.casilla.abierta .puerta { transform: rotateY(-106deg); }
.casilla.sacude { animation: sacude .45s; }
@keyframes sacude { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.leyenda { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; font-size: 13px; color: var(--crema-tenue); }
.leyenda span { display: inline-flex; align-items: center; gap: 8px; }
.leyenda i { width: 14px; height: 18px; border-radius: 3px; display: inline-block; }
.leyenda .l1 { background: var(--rojo); filter: saturate(.8) brightness(.9); }
.leyenda .l2 { background: var(--rojo); box-shadow: 0 0 8px 2px rgba(246,220,156,.75); }
.leyenda .l3 { background: #170e08; box-shadow: inset 0 0 0 1px var(--oro); }

/* ---------- Portada de bienvenida ---------- */
body.con-portada { overflow: hidden; }
body.con-portada #nieve { z-index: 55; }
.portada {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(ellipse 90% 55% at 50% 38%, #1f4f3c 0%, transparent 70%),
    radial-gradient(ellipse 120% 40% at 50% 110%, #12302a 0%, transparent 70%),
    var(--noche);
  transition: opacity .8s ease, visibility .8s;
}
.portada.fuera { opacity: 0; visibility: hidden; pointer-events: none; }
.portada-contenido { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(420px, 100%); }
.portada-contenido > :not(.caja) { transition: opacity .45s ease, transform .45s ease; }
.caja {
  position: relative; width: min(250px, 64vw); max-width: 100%; margin-bottom: 4px;
  border: 0; padding: 0; background: none; cursor: pointer; border-radius: 16px;
  animation: flota 3.4s ease-in-out infinite;
}
.caja:focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 8px; }
.caja svg { display: block; width: 100%; height: auto; overflow: visible; }
@keyframes flota { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-10px) rotate(1.5deg); } }
#tapa { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .75s cubic-bezier(.3,.6,.2,1), opacity .55s ease; }
#etiquetaRegalo { transform-box: fill-box; transform-origin: 0% 0%; animation: balanceo 2.8s ease-in-out infinite; transition: transform .6s ease, opacity .4s ease; }
@keyframes balanceo { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
.destello {
  position: absolute; left: 50%; top: 46%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  background: radial-gradient(circle, #fff8dc 0%, rgba(246,220,156,.85) 30%, rgba(228,185,94,0) 70%);
  opacity: 0; transform: scale(0); pointer-events: none;
}
.chispa {
  position: absolute; left: 50%; top: 40%; width: 7px; height: 7px; margin: -3px; border-radius: 50%;
  background: var(--c, var(--oro-claro)); box-shadow: 0 0 8px 2px var(--c, var(--oro-claro));
  opacity: 0; pointer-events: none;
}
.portada.abriendo .caja { animation: sacudida .5s ease-in-out; }
@keyframes sacudida { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-7deg) scale(1.03); } 40% { transform: rotate(6deg) scale(1.05); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); } }
.portada.abriendo #tapa { transform: translateY(-170%) rotate(-32deg); opacity: 0; transition-delay: .45s; }
.portada.abriendo #etiquetaRegalo { animation: none; transform: translate(30%, 60%) rotate(70deg); opacity: 0; transition-delay: .35s; }
.portada.abriendo .destello { animation: destelloAbre 1.2s .65s ease-out forwards; }
.portada.abriendo .chispa { animation: chispaVuela 1s calc(.6s + var(--r) * .2s) cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes destelloAbre { 0% { opacity: 0; transform: scale(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(70); } }
@keyframes chispaVuela { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.3); } }
.portada.abriendo .portada-contenido > :not(.caja) { opacity: 0; transform: translateY(12px); }
.portada-titulo {
  margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--crema);
  font-size: clamp(34px, 9vw, 54px); line-height: 1.05; text-wrap: balance;
}
.portada-titulo em { color: var(--oro); font-style: italic; }
.portada-sub { margin: 0; color: var(--crema-tenue); font-size: 15px; text-wrap: balance; }
.portada-btn {
  margin-top: 6px; border: 0; cursor: pointer;
  padding: 14px 32px; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: .02em;
  background: var(--oro); color: var(--rojo-osc);
  box-shadow: 0 10px 30px rgba(228,185,94,.35), inset 0 -3px 0 rgba(0,0,0,.12);
}
.portada-btn:hover { background: var(--oro-claro); }
.portada-btn:focus-visible { outline: 3px solid var(--crema); outline-offset: 3px; }

/* entrada del calendario tras la portada */
.calendario.entrada .casilla { animation: entraPuerta .6s cubic-bezier(.2,.8,.2,1.15) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes entraPuerta { from { opacity: 0; transform: translateY(22px) scale(.92); } to { opacity: 1; transform: none; } }
header.entrada > * { animation: entraCabecera .7s ease both; }
header.entrada > :nth-child(2) { animation-delay: .08s; }
header.entrada > :nth-child(3) { animation-delay: .16s; }
header.entrada > :nth-child(4) { animation-delay: .24s; }
@keyframes entraCabecera { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- Vista previa (solo la dueña) ---------- */
.previa-btn {
  position: fixed; z-index: 25;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 800;
  background: var(--pino); color: var(--crema);
  border: 1px solid color-mix(in srgb, var(--oro) 55%, transparent);
  box-shadow: 0 8px 24px var(--sombra);
}
.previa-btn svg { width: 18px; height: 18px; }
.previa-btn[aria-pressed="true"] { background: var(--oro); color: var(--rojo-osc); border-color: var(--oro-claro); }
.previa-btn:focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 3px; }
body.previa .casilla.bloqueada .puerta { filter: none; }
body.previa .casilla.bloqueada { outline: 2px dashed color-mix(in srgb, var(--oro-claro) 70%, transparent); outline-offset: 3px; }

/* ---------- Aviso ---------- */
.aviso {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); width: max-content;
  padding: 12px 18px; border-radius: 12px; text-align: center;
  background: var(--crema); color: var(--rojo-osc); font-weight: 700; font-size: 14px;
  box-shadow: 0 10px 30px var(--sombra); transition: opacity .25s, transform .25s;
}
.aviso.ver { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Ventana del regalo ---------- */
.velo {
  position: fixed; inset: 0; z-index: 40; display: grid;
  grid-template-columns: minmax(0, 480px); justify-content: center; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background: rgba(5, 15, 12, .74); backdrop-filter: blur(4px);
}
.regalo {
  position: relative; width: 100%; min-width: 0; max-height: calc(100dvh - 48px); overflow: auto;
  background: var(--crema); color: #3a1a14; border-radius: 20px;
  padding: 32px 26px 26px; text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 3px var(--oro), inset 0 0 0 8px var(--crema), inset 0 0 0 9px color-mix(in srgb, var(--rojo) 40%, transparent);
  animation: aparece .45s cubic-bezier(.2,.8,.2,1.2);
}
@keyframes aparece { from { transform: scale(.85) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.regalo .dia { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--rojo); }
.regalo h2 { margin: 6px 0 12px; font-family: var(--f-display); font-weight: 400; font-size: 36px; line-height: 1.1; color: var(--rojo-osc); text-wrap: balance; }
.contenido { display: flex; flex-direction: column; align-items: center; gap: 18px; color: #5b3b30; }
.texto { max-width: 38ch; }
.texto p { margin: 0 0 10px; }
.texto p:last-child { margin-bottom: 0; }
.texto ol { margin: 0; padding-left: 1.4em; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.texto ol li::marker { color: var(--rojo); font-weight: 800; }

.polaroid {
  margin: 4px 0 0; width: min(290px, 100%);
  background: #fff; padding: 10px 10px 8px; border-radius: 3px;
  box-shadow: 0 10px 24px rgba(58, 26, 20, .25), 0 1px 3px rgba(58, 26, 20, .2);
  transform: rotate(var(--giro, -2deg));
}
.polaroid img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #eee; }
.polaroid.apaisada { width: min(340px, 100%); }
.polaroid.apaisada img { aspect-ratio: 4 / 3; }
.polaroid.vertical { width: min(270px, 100%); }
.polaroid.vertical img { aspect-ratio: 2 / 3; }
/* recorte sin fondo: se ve entero sobre un fondo navideño */
.polaroid.recorte img {
  object-fit: contain; object-position: 50% 100%; padding-top: 6%;
  background:

    copo: '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.8L12 6l2.5-2.2M9.5 20.2L12 18l2.5 2.2M4 10.6l3.2-.9-.7-3.2M20 13.4l-3.2.9.7 3.2M4 13.4l3.2.9-.7 3.2M20 10.6l-3.2-.9.7-3.2"/></g>',
    acebo: '<g fill="currentColor"><path d="M12 13C9 9 4 9 2 11c2 .4 2 2 1 3 2-.5 3 .7 3 2 2-2 5-2 6-3z" opacity=".85"/><path d="M12 13c3-4 8-4 10-2-2 .4-2 2-1 3-2-.5-3 .7-3 2-2-2-5-2-6-3z" opacity=".85"/><circle cx="12" cy="10" r="2.2"/><circle cx="9.6" cy="8" r="2"/><circle cx="14.4" cy="8" r="2"/></g>',
    bola: '<g fill="currentColor"><circle cx="12" cy="14" r="7.5"/><rect x="10" y="4.5" width="4" height="3" rx=".8"/><path d="M12 2.5a1.6 1.6 0 1 1 0 2" stroke="currentColor" fill="none" stroke-width="1.2"/></g><path d="M5 13c4 2 10 2 14 0" stroke="rgba(0,0,0,.25)" stroke-width="1.6" fill="none"/>',
    arbol: '<g fill="currentColor"><path d="M12 2l5 7h-2.5l4 5.5h-3l4 5.5H4.5l4-5.5h-3l4-5.5H7z"/><rect x="10.6" y="20" width="2.8" height="2.5"/></g>'
  };
  const svgCandado = '<svg class="candado" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>';
  const svgRegalo = (n) => {
    const tonos = n === 24 ? ["#e4b95e", "#b3262d"] : n === 14 ? ["#c9d7e3", "#1f3550"]
      : [["#2f7a52", "#f6dc9c"], ["#c8343b", "#f6dc9c"], ["#e4b95e", "#b3262d"]][n % 3];
    const [caja, cinta] = tonos;
    return `<svg viewBox="0 0 64 64" aria-hidden="true">
      <rect x="10" y="26" width="44" height="32" rx="3" fill="${caja}"/>
      <rect x="6" y="18" width="52" height="11" rx="3" fill="${caja}"/>
      <rect x="6" y="18" width="52" height="11" rx="3" fill="#000" opacity=".12"/>
      <rect x="28" y="18" width="8" height="40" fill="${cinta}"/>
      <path d="M32 18 C24 4, 12 8, 18 16 C20 18, 26 18, 32 18Z" fill="${cinta}"/>
      <path d="M32 18 C40 4, 52 8, 46 16 C44 18, 38 18, 32 18Z" fill="${cinta}"/>
    </svg>`;
  };

  // ================= GUIRNALDA =================
  const luces = document.getElementById("luces");
  const COLORES_LUZ = ["#ff5a5f", "#ffd166", "#5ad1a0", "#6fb7ff", "#ff9f43"];
  const NL = 15;
  for (let i = 0; i < NL; i++) {
    const t = (i + .5) / NL;
    const y = 6 + 80 * t * (1 - t); // altura del cable (curva cuadrática del SVG) en ese punto
    const b = document.createElement("span");
    b.className = "bombilla";
    b.style.left = `${t * 100}%`;
    b.style.top = `${y + 2}px`;
    b.style.setProperty("--c", COLORES_LUZ[i % COLORES_LUZ.length]);
    b.style.setProperty("--d", `${(i * 0.37) % 2.8}s`);
    luces.appendChild(b);
  }

  // ================= PINTAR PUERTAS =================
  const calendario = document.getElementById("calendario");
  const casillas = {};
  for (let n = 1; n <= DIAS; n++) {
    const [color, patron, adorno] = ASPECTO[n].split(" ");
    const b = document.createElement("button");
    b.type = "button";
    b.id = `puerta-${n}`;
    b.style.gridArea = `d${n}`;
    b.style.setProperty("--i", n - 1); // orden de entrada tras la portada: del 1 al 24
    b.className = `casilla c-${color} p-${patron}` + (n === 14 || n === 24 ? ` especial-${n}` : "");
    const brillos = (n === 14 || n === 24)
      ? `<span class="brillos">${[[18,22,0],[78,18,.8],[70,78,1.6],[24,72,2.2]].map(([x,y,d]) => `<i style="left:${x}%;top:${y}%;animation-delay:${d}s"></i>`).join("")}</span>` : "";
    b.innerHTML = `
      <span class="interior">${svgRegalo(n)}</span>
      <span class="puerta">${brillos}
        <svg class="adorno" viewBox="0 0 24 24" aria-hidden="true">${ADORNOS[adorno]}</svg>
        <span class="num">${n}</span>
        <span class="etiqueta"></span>
      </span>`;
    b.addEventListener("click", () => pulsar(n));
    calendario.appendChild(b);
    casillas[n] = b;
  }

  function estadoDe(n) {
    if (!disponible(n)) return "bloqueada";
    return abiertas.has(n) ? "abierta" : "disponible";
  }
  function pintarCasilla(n) {
    const b = casillas[n];
    const est = estadoDe(n);
    if (b.dataset.estado === est) return;
    b.dataset.estado = est;
    b.classList.remove("bloqueada", "disponible", "abierta");
    b.classList.add(est);
    const et = b.querySelector(".etiqueta");
    if (est === "bloqueada") {
      et.innerHTML = svgCandado;
      b.setAttribute("aria-label", `Día ${n}, se abre el ${n} de diciembre`);
    } else if (est === "disponible") {
      et.textContent = "¡Ábreme!";
      b.setAttribute("aria-label", `Día ${n}, listo para abrir`);
    } else {
      et.textContent = "";
      b.setAttribute("aria-label", `Día ${n}, abierto. Ver regalo`);
    }
  }

  function pulsar(n) {
    const est = estadoDe(n);
    if (est === "bloqueada" && vistaPrevia) {
      mostrarRegalo(n); // solo para mirar: no cuenta como abierta
      return;
    }
    if (est === "bloqueada") {
      const b = casillas[n];
      b.classList.remove("sacude"); void b.offsetWidth; b.classList.add("sacude");
      avisar(`La puerta ${n} se abre el ${n} de diciembre a las 0:00 (faltan ${restante(aperturaDe(n) - ahora(), true)})`);
      return;
    }
    if (est === "disponible") {
      abiertas.add(n);
      guardarAbiertas();
      pintarCasilla(n);
      setTimeout(() => mostrarRegalo(n), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 800);
      return;
    }
    mostrarRegalo(n);
  }

  // ================= VENTANA DEL REGALO =================
  const velo = document.getElementById("velo");
  let ultimoFoco = null;
  function mostrarRegalo(n) {
    const r = regaloDe(n);
    document.getElementById("regaloDia").textContent = `${n} de diciembre`;
    document.getElementById("regaloTitulo").textContent = r.titulo;
    pintarContenido(n, r);
    ultimoFoco = casillas[n];
    velo.hidden = false;
    document.getElementById("regaloCerrar").focus();
  }
  function crear(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto != null) e.textContent = texto;
    return e;
  }
  function pintarContenido(n, r) {
    const c = document.getElementById("regaloContenido");
    c.replaceChildren();

    if ("foto" in r) {
      const fig = crear("figure", "polaroid" + (r.apaisada ? " apaisada" : "") + (r.vertical ? " vertical" : "") + (r.recorte ? " recorte" : ""));
      fig.style.setProperty("--giro", n % 2 ? "-2deg" : "2deg");
      if (r.foto) {
        const img = crear("img");
        img.src = r.foto; img.alt = r.pie || `Foto del día ${n}`;
        fig.append(img);
      } else {
        fig.append(crear("div", "hueco", "Foto pendiente de añadir"));
      }
      if (r.pie) fig.append(crear("figcaption", "", r.pie));
      c.append(fig);
    }

    if (r.texto) {
      const t = crear("div", "texto");
      const lineas = r.texto.split("\n").filter(Boolean);
      if (lineas.length > 1 && lineas.every((l) => /^\d+\.\s/.test(l))) {
        const ol = crear("ol");
        lineas.forEach((l) => ol.append(crear("li", "", l.replace(/^\d+\.\s/, ""))));
        t.append(ol);
      } else {
        r.texto.split(/\n\s*\n/).forEach((p) => t.append(crear("p", "", p.trim())));
      }
      c.append(t);
    }

    if (r.vale) {
      const v = crear("div", "vale");
      v.append(crear("div", "por", "Vale por"), crear("h3", "", r.vale.titulo));
      if (r.vale.detalle) v.append(crear("p", "", r.vale.detalle));
      const s = crear("div", "serie");
      s.append(crear("span", "", `Nº ${String(n).padStart(2, "0")}`), crear("span", "", "Canjeable cuando quieras"));
      v.append(s);
      c.append(v);
    }

    if (r.enlace) {
      const a = crear("a", "enlace");
      a.href = r.enlace.url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 18V5l12-2v13a3 3 0 1 1-2-2.83V6.7l-8 1.34V18a3 3 0 1 1-2-2.83Z"/></svg>';
      a.append(document.createTextNode(r.enlace.texto || "Abrir"));
      c.append(a);
    }

    if (r.firma) c.append(crear("div", "firma", r.firma));
  }

  function cerrarRegalo() { velo.hidden = true; if (ultimoFoco) ultimoFoco.focus(); }
  document.getElementById("regaloCerrar").addEventListener("click", cerrarRegalo);
  document.getElementById("regaloX").addEventListener("click", cerrarRegalo);
  velo.addEventListener("click", (e) => { if (e.target === velo) cerrarRegalo(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !velo.hidden) cerrarRegalo(); });

  // ================= AVISO =================
  const aviso = document.getElementById("aviso");
  let tAviso;
  function avisar(txt) {
    aviso.textContent = txt;
    aviso.classList.add("ver");
    clearTimeout(tAviso);
    tAviso = setTimeout(() => aviso.classList.remove("ver"), 3200);
  }

  // ================= CUENTA ATRÁS =================
  function restante(ms, corto) {
    ms = Math.max(0, ms);
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60;
    const pad = (x) => String(x).padStart(2, "0");
    if (corto) {
      if (d > 0) return `${d} ${d === 1 ? "día" : "días"} y ${h} h`;
      if (h > 0) return `${h} h y ${m} min`;
      return `${m} min y ${seg} s`;
    }
    return (d > 0 ? `${d} ${d === 1 ? "día" : "días"} · ` : "") + `${pad(h)}:${pad(m)}:${pad(seg)}`;
  }
  function actualizar() {
    for (let n = 1; n <= DIAS; n++) pintarCasilla(n);
    const t = ahora();
    let siguiente = null;
    for (let n = 1; n <= DIAS; n++) if (t < aperturaDe(n)) { siguiente = n; break; }
    const txt = document.getElementById("cuentaTexto");
    const reloj = document.getElementById("cuentaReloj");
    pintarPortada(t, siguiente);
    if (siguiente === null) {
      txt.textContent = "Todas las puertas están abiertas. ¡Feliz Navidad!";
      reloj.textContent = "";
    } else {
      txt.textContent = siguiente === 1 ? "La primera puerta se abre en" : `La puerta ${siguiente} se abre en`;
      reloj.textContent = restante(aperturaDe(siguiente) - t);
    }
  }

  // ================= PORTADA DE BIENVENIDA =================
  const portada = document.getElementById("portada");
  const portadaSub = document.getElementById("portadaSub");
  document.body.classList.add("con-portada");
  function pintarPortada(t, siguiente) {
    if (portada.hidden) return;
    let txt;
    if (siguiente === 1) {
      const dias = Math.ceil((aperturaDe(1) - t) / 86400000);
      txt = dias <= 1 ? "La primera puerta se abre esta medianoche" : `Faltan ${dias} días para la primera puerta`;
    } else if (siguiente === null) {
      txt = "Todas las puertas están abiertas. ¡Feliz Navidad!";
    } else {
      const hoy = siguiente - 1;
      txt = abiertas.has(hoy) ? `Hoy ya has abierto la puerta ${hoy}` : `Hoy te espera la puerta ${hoy}`;
    }
    if (portadaSub.textContent !== txt) portadaSub.textContent = txt;
  }
  function abrirPortada() {
    if (portada.classList.contains("abriendo")) return;
    portada.classList.add("abriendo");
    const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => {
      portada.classList.add("fuera");
      document.body.classList.remove("con-portada");
      calendario.classList.add("entrada");
      document.querySelector("header").classList.add("entrada");
      setTimeout(() => {
        portada.hidden = true;
        calendario.classList.remove("entrada");
        document.querySelector("header").classList.remove("entrada");
      }, 1800);
    }, reducir ? 0 : 1500);
  }
  document.getElementById("portadaCaja").addEventListener("click", abrirPortada);
  document.getElementById("portadaBtn").addEventListener("click", abrirPortada);
  try { document.getElementById("portadaBtn").focus({ preventScroll: true }); } catch (e) {}

  // ================= VISTA PREVIA (solo la dueña del calendario) =================
  // El botón solo aparece si quien abre la página es la persona que la creó.
  let vistaPrevia = false;
  const previaBtn = document.getElementById("previaBtn");
  previaBtn.addEventListener("click", () => {
    vistaPrevia = !vistaPrevia;
    previaBtn.setAttribute("aria-pressed", String(vistaPrevia));
    document.getElementById("previaTxt").textContent = vistaPrevia ? "Vista previa activada" : "Vista previa";
    document.body.classList.toggle("previa", vistaPrevia);
    avisar(vistaPrevia
      ? "Vista previa: puedes abrir cualquier día sin que cuente como abierto. Solo tú ves este botón."
      : "Vista previa desactivada.");
  });
  // En la web propia: abrir el enlace con ?previa=<clave> marca este navegador para ver el botón.
  // ?previa=no lo desmarca. Después se limpia la dirección para no dejar la clave a la vista.
  const CLAVE_PREVIA = "zYsY_5RjWpHr";
  let previaGuardada = false;
  try {
    const q = new URLSearchParams(location.search);
    const p = q.get("previa");
    if (p === CLAVE_PREVIA) localStorage.setItem("adviento-previa", "1");
    if (p === "no") localStorage.removeItem("adviento-previa");
    if (p !== null) { q.delete("previa"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "")); }
    previaGuardada = localStorage.getItem("adviento-previa") === "1";
  } catch (e) {}

  (async () => {
    let dueno = !!ahoraPrueba || previaGuardada; // en pruebas locales también se muestra
    if (dueno) { previaBtn.hidden = false; return; }
    try {
      const user = window.claude && window.claude.use ? await window.claude.use("user") : null;
      if (user && await user.isOwner()) dueno = true;
    } catch (e) {}
    if (dueno) previaBtn.hidden = false;
  })();

  actualizar();
  sincronizar();
  setInterval(actualizar, 1000);
  setInterval(sincronizar, 10 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sincronizar(); });

  // ================= NIEVE =================
  const cv = document.getElementById("nieve");
  const cx = cv.getContext("2d");
  const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let copos = [], W = 0, H = 0;
  function medir() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cant = Math.round(Math.min(140, W * H / 9000));
    copos = Array.from({ length: cant }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 2.2 + .6, v: Math.random() * .6 + .25,
      o: Math.random() * Math.PI * 2, a: Math.random() * .5 + .35
    }));
  }
  function dibujar() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = "#ffffff";
    for (const c of copos) {
      cx.globalAlpha = c.a;
      cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, Math.PI * 2); cx.fill();
    }
  }
  function animar() {
    for (const c of copos) {
      c.y += c.v; c.o += .01; c.x += Math.sin(c.o) * .3;
      if (c.y > H + 4) { c.y = -4; c.x = Math.random() * W; }
    }
    dibujar();
    requestAnimationFrame(animar);
  }
  medir();
  addEventListener("resize", medir);
  if (reducir) dibujar(); else requestAnimationFrame(animar);
})();
</script>

</body>
</html>
